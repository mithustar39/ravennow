# Render blueprint. Push to a Git repo, then "New > Blueprint" in Render.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ravennow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: RAVENNOW_ENV
        value: production
      - key: RAVENNOW_SECRET
        generateValue: true
      - key: RAVENNOW_SUPPORT_EMAIL
        value: hello@ravennow.ca
      - key: RAVENNOW_ADMIN_TOKEN
        generateValue: true
      - key: RAVENNOW_DB
        fromDatabase:
          name: ravennow-db
          property: connectionString
      # After the first deploy, set this to your service URL so robots.txt and
      # sitemap.xml use the right origin.
      # - key: RAVENNOW_PUBLIC_URL
      #   value: https://ravennow.onrender.com

databases:
  - name: ravennow-db
    plan: free
